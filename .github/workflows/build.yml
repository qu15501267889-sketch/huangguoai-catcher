name: Build and Push Docker Image

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: qu15501267889-sketch/huangguoai-catcher

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 等包创建完成
          sleep 10
          # 用GH CLI设置公开（workflow token有packages:write权限）
          gh api \
            -X PATCH \
            "/user/packages/container/${IMAGE_NAME#*/}" \
            -f visibility=public \
            --hostname github.com 2>&1 || \
          echo "::warning::Could not auto-set package public. Please set manually at: https://github.com/users/${{ github.repository_owner }}/packages/container/${IMAGE_NAME#*/}/settings"
